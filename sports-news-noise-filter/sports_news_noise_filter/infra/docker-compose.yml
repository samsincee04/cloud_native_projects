# Run from this directory: cd infra && docker compose up --build -d
# Worker (on-demand): docker compose --profile worker run --rm worker

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportsnews}
      POSTGRES_USER: ${POSTGRES_USER:-sports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sports}
    volumes:
      - sportsnews_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://sports:sports@db:5432/sportsnews}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  worker:
    profiles:
      - worker
    build:
      context: ..
      dockerfile: worker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql://sports:sports@db:5432/sportsnews}
      ENABLE_LLM_SUMMARY: ${ENABLE_LLM_SUMMARY:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1200}
      LLM_TIMEOUT_SECS: ${LLM_TIMEOUT_SECS:-60}
      LLM_ENRICH_SLEEP_SECS: ${LLM_ENRICH_SLEEP_SECS:-0}
    # On-demand: docker compose --profile worker run --rm worker

volumes:
  sportsnews_pgdata:
